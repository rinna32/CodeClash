[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "io-util", "macros", "rt-multi-thread", "sync"] }
tempfile = "3"
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "json"] }
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
